name: transitflow-go

services:
  # ---- Infrastructure ----
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: transitflow-go-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: transitflow-go-cluster-0001
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  trips-db:
    image: postgres:16-alpine
    container_name: transitflow-go-trips-db
    environment:
      POSTGRES_DB: trips
      POSTGRES_USER: transitflow
      POSTGRES_PASSWORD: transitflow
    ports:
      - "5443:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transitflow -d trips"]
      interval: 5s
      timeout: 5s
      retries: 10

  bookings-db:
    image: postgres:16-alpine
    container_name: transitflow-go-bookings-db
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: transitflow
      POSTGRES_PASSWORD: transitflow
    ports:
      - "5444:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transitflow -d bookings"]
      interval: 5s
      timeout: 5s
      retries: 10

  payments-db:
    image: postgres:16-alpine
    container_name: transitflow-go-payments-db
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: transitflow
      POSTGRES_PASSWORD: transitflow
    ports:
      - "5445:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transitflow -d payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Services ----
  trip-service:
    build:
      context: .
      args:
        SERVICE: trip
    container_name: transitflow-go-trip-service
    depends_on:
      trips-db:
        condition: service_healthy
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://transitflow:transitflow@trips-db:5432/trips?sslmode=disable
    ports:
      - "8081:8081"

  payment-service:
    build:
      context: .
      args:
        SERVICE: payment
    container_name: transitflow-go-payment-service
    depends_on:
      payments-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      PORT: "8083"
      DATABASE_URL: postgres://transitflow:transitflow@payments-db:5432/payments?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      TRANSITFLOW_PAYMENT_DECLINE_ABOVE: "500.00"
    ports:
      - "8083:8083"

  booking-service:
    build:
      context: .
      args:
        SERVICE: booking
    container_name: transitflow-go-booking-service
    depends_on:
      bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      trip-service:
        condition: service_started
    environment:
      PORT: "8082"
      DATABASE_URL: postgres://transitflow:transitflow@bookings-db:5432/bookings?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      TRIP_SERVICE_URL: http://trip-service:8081
      OUTBOX_POLL_INTERVAL_MS: "2000"
    ports:
      - "8082:8082"
